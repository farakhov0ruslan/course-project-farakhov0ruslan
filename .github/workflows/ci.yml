name: CI
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sca:
    name: SCA & SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps (best-effort)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Install SCA & SBOM tooling
        run: pip install pip-audit safety cyclonedx-bom

      - name: Freeze environment
        run: pip freeze | sort > requirements.lock.txt

      # 1) Генерим отчет pip-audit (не фейлим шаг)
      - name: pip-audit generate JSON
        id: pip_audit
        continue-on-error: true
        run: |
          pip-audit -r requirements.lock.txt -f json -o pip-audit.json || true
          python - <<'PY'
          import json, os
          sev_order={"LOW":1,"MEDIUM":2,"HIGH":3,"CRITICAL":4}
          v=[]
          try:
              data=json.load(open("pip-audit.json","r",encoding="utf-8"))
              for pkg in data:
                  for vul in pkg.get("vulns", []):
                      s=(vul.get("severity") or "").upper()
                      if sev_order.get(s,0)>=3:
                          v.append((pkg.get("name"), s, vul.get("id")))
          except Exception as e:
              print("pip-audit parse error:", e)
          print(f"High/Critical findings: {len(v)}")
          if v:
              lines=["### pip-audit High/Critical findings","",""] + [f"- {n}: {s} — {vid}" for n,s,vid in v]
              open("pip_audit_summary.md","w",encoding="utf-8").write("\n".join(lines))
              # Флажок для следующих шагов
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write("PIP_AUDIT_HIGH_OR_CRIT=1\n")
          else:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write("PIP_AUDIT_HIGH_OR_CRIT=0\n")
          PY

      - name: safety (non-blocking)
        run: safety check --full-report --json > safety.json || true

      - name: Generate SBOM (CycloneDX from active env)
        run: |
          python -m pip install --upgrade cyclonedx-bom
          python -m cyclonedx_py environment \
            -o sbom.cdx.json \
            --output-format json

      - name: Upload SCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: |
            requirements.lock.txt
            pip-audit.json
            pip_audit_summary.md
            safety.json
            sbom.cdx.json

      # 2) Если есть High/Critical — создаем Issue и заваливаем job
      - name: Create Issue on High/Critical (triage≤3d, fix≤7d)
        if: env.PIP_AUDIT_HIGH_OR_CRIT == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('pip_audit_summary.md') ? fs.readFileSync('pip_audit_summary.md','utf8') : '';
            const triageBy = new Date(Date.now() + 3*24*3600*1000).toISOString().slice(0,10);
            const fixBy    = new Date(Date.now() + 7*24*3600*1000).toISOString().slice(0,10);
            const title = `SCA: High/Critical vulnerabilities detected (triage ≤ ${triageBy}, fix ≤ ${fixBy})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['security','sca','NFR-05'],
              body: `**NFR-05 / R-04 (supply-chain)**\n\n${summary}\n\n- Triage deadline: ${triageBy}\n- Fix deadline: ${fixBy}\n\nAttach artifacts from 'sca-reports'.`
            });

      - name: Fail job if High/Critical found
        if: env.PIP_AUDIT_HIGH_OR_CRIT == '1'
        run: |
          echo "High/Critical vulnerabilities found. Failing SCA job per NFR-05."
          exit 2

  build:
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint & Format
        run: |
          ruff check . --output-format=github
          black --check .
          isort --check-only .

      - name: Tests
        run: pytest -q

      - name: Pre-commit (all files)
        run: pre-commit run --all-files
  docker_security:
    name: Dockerfile lint & image scan
    runs-on: ubuntu-latest
    needs: [ build ]
    permissions:
      contents: read
      security-events: write

    env:
      IMAGE_NAME: course-project-farakhov0ruslan-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Hadolint ---
      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile
          failure-threshold: error

      # --- Build image for Trivy ---
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      # --- Trivy image scan ---
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          output: 'trivy-report.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
