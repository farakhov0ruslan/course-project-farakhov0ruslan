name: CI
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: ${{ secrets.APP_ENV }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint & Format
        run: |
          ruff check . --output-format=github
          black --check .
          isort --check-only .

      - name: Tests
        run: |
          mkdir -p reports
          pytest -q --maxfail=1 --disable-warnings --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/**

      - name: Pre-commit (all files)
        run: pre-commit run --all-files
  docker_security:
    name: Dockerfile lint & image scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    env:
      IMAGE_NAME: course-project-farakhov0ruslan-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Hadolint ---
      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile
          failure-threshold: error

      # --- Build image for Trivy ---
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      # --- Trivy image scan ---
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          output: 'trivy-report.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  deploy-main:
    name: Mock deploy (main)
    runs-on: ubuntu-latest
    needs:
      - build
      - docker_security
    # CD только на push в main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      APP_ENV: ${{ secrets.APP_ENV }}

    steps:
      - name: Mock deploy to production/staging (main)
        run: |
          echo "Mock deploy: would deploy Study Notes API from main branch."
          echo "Target environment: production/staging."
          echo "Gates passed: SCA, tests, docker security."

  deploy-dev:
    name: Mock deploy (dev)
    runs-on: ubuntu-latest
    needs:
      - build
      - docker_security
    # CD для PR и для push в ветки, КРОМЕ main
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref != 'refs/heads/main')
    env:
      APP_ENV: ${{ secrets.APP_ENV }}

    steps:
      - name: Mock deploy to dev environment
        run: |
          echo "Mock deploy: would deploy Study Notes API to DEV environment."
          echo "Branch/PR is not main => using dev/staging-like environment."
          echo "Gates passed: SCA, tests, docker security."
