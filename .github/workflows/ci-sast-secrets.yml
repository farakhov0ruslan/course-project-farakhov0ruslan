name: Security - SAST & Secrets

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - "security/semgrep/**"
      - "security/.gitleaks.toml"
      - ".github/workflows/ci-sast-secrets.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast_secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better Gitleaks detection

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P10

      - name: Semgrep CI (SARIF)
        run: |
          docker run --rm -v $PWD:/src returntocorp/semgrep:latest \
            semgrep ci --config p/ci --config /src/security/semgrep/rules.yml \
              --sarif --output /src/EVIDENCE/P10/semgrep.sarif --metrics=off || true

      - name: Gitleaks detect
        run: |
          docker run --rm -v $PWD:/repo zricethezav/gitleaks:latest \
            detect --no-banner --config=/repo/security/.gitleaks.toml \
              --source=/repo --report-format=json \
              --report-path=/repo/EVIDENCE/P10/gitleaks.json || true

      - name: Generate SAST summary
        run: |
          python3 - <<'PY'
          import json
          import os

          summary_lines = ["# SAST & Secrets Scan Summary\n\n"]

          # Process Semgrep SARIF
          try:
              with open("EVIDENCE/P10/semgrep.sarif", "r", encoding="utf-8") as f:
                  sarif_data = json.load(f)

              results = sarif_data.get("runs", [{}])[0].get("results", [])

              severity_counts = {"error": 0, "warning": 0, "note": 0}
              for result in results:
                  level = result.get("level", "note").lower()
                  if level in severity_counts:
                      severity_counts[level] += 1

              summary_lines.append("## Semgrep (SAST) Results\n\n")
              summary_lines.append(f"- **Errors**: {severity_counts['error']}\n")
              summary_lines.append(f"- **Warnings**: {severity_counts['warning']}\n")
              summary_lines.append(f"- **Notes**: {severity_counts['note']}\n")
              summary_lines.append(f"\n**Total findings**: {len(results)}\n\n")

              if results:
                  summary_lines.append("### Key Findings:\n\n")
                  for idx, result in enumerate(results[:5], 1):  # Show top 5
                      msg = result.get("message", {}).get("text", "No message")
                      rule_id = result.get("ruleId", "unknown")
                      summary_lines.append(f"{idx}. [{rule_id}] {msg}\n")

          except Exception as e:
              summary_lines.append(f"## Semgrep: Error parsing results - {e}\n\n")

          # Process Gitleaks JSON
          try:
              with open("EVIDENCE/P10/gitleaks.json", "r", encoding="utf-8") as f:
                  gitleaks_data = json.load(f)

              findings = gitleaks_data if isinstance(gitleaks_data, list) else []

              summary_lines.append("## Gitleaks (Secrets) Results\n\n")
              summary_lines.append(f"- **Secrets detected**: {len(findings)}\n\n")

              if findings:
                  summary_lines.append("### Detected Secrets:\n\n")
                  for idx, finding in enumerate(findings[:10], 1):  # Show top 10
                      rule_id = finding.get("RuleID", "unknown")
                      file_path = finding.get("File", "unknown")
                      summary_lines.append(f"{idx}. [{rule_id}] in `{file_path}`\n")
              else:
                  summary_lines.append("No secrets detected.\n")

          except FileNotFoundError:
              summary_lines.append("## Gitleaks: No report found (no secrets detected)\n\n")
          except Exception as e:
              summary_lines.append(f"## Gitleaks: Error parsing results - {e}\n\n")

          # Write summary
          with open("EVIDENCE/P10/sast_summary.md", "w", encoding="utf-8") as f:
              f.writelines(summary_lines)

          print("".join(summary_lines))
          PY

      - name: Upload SAST & Secrets evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P10_EVIDENCE
          path: EVIDENCE/P10
